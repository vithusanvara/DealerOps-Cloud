# Name displayed for this workflow in GitHub's Actions tab.
name: DealerOps Continuous Integration

# Decide when GitHub should run the workflow.
on:
  # Run whenever code is pushed to the main branch.
  push:
    branches:
      - main

  # Run whenever a pull request targets the main branch.
  pull_request:
    branches:
      - main

# Define the automated work GitHub will perform.
jobs:
  test:
    # Use a temporary Ubuntu computer provided by GitHub.
    runs-on: ubuntu-latest

    steps:
      # Download the repository files onto the temporary computer.
      - name: Check out repository
        uses: actions/checkout@v4

      # Install the specified version of Python.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Upgrade pip and install the packages from requirements.txt.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run all automated tests located in the tests folder.
            # Run the tests through Python and explicitly include the
      # repository's root folder in Python's import path.
      - name: Run automated tests
        env:
          PYTHONPATH: .
        run: python -m pytest
